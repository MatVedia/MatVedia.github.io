    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="layout-principal">

        <!-- ENCABEZADO CON MENÚ HAMBURGUESA -->
        <header class="encabezado">
    <!-- El logo ahora está dentro de un enlace que apunta a index.html -->

        <a href="index.html">
            <img src="Logo.png" alt="TU CATERING - Ir al inicio">

<!-- Botón con función directa para que abra siempre -->

        <span></span>

    <nav class="menu" id="menu-nav">
        <a href="sobrenosotros.html">Sobre nosotros</a>

        <a href="index.html">Inicio</a>
    </nav>
</header>

        <!-- CONTENIDO PRINCIPAL: PRESUPUESTO -->
        <main>
            <section class="seccion-presupuesto">
                <div class="titulo-con-linea">
                    <span class="linea-decorativa"></span>
                    <h1>Presupuesto</h1>
                </div>

                <form id="formularioPresupuesto" class="form-presupuesto">

                    <!-- Tipo de evento -->
                    <div class="grupo-campo">
                        <label for="tipo-evento">Tipo de evento</label>
                        <div class="select-personalizado">
                            <select id="tipo-evento" required>
                                <option value="Boda">Boda</option>
                                <option value="Evento Corporativo">Evento Corporativo</option>
                                <option value="Banquete">Banquete</option>
                            </select>
                        </div>
                    </div>

                    <!-- Cantidad de personas -->
                    <div class="grupo-campo">
                        <label for="cantidad-personas">Cantidad de personas</label>
                        <input type="number" id="cantidad-personas" min="1" placeholder="Ej: 50" required class="input-estilo">
                    </div>

                    <!-- ¿Cuentan con salón? -->
                    <div class="grupo-campo">
                        <label>¿Cuentan con salón?</label>
                        <div class="grupo-opciones">
                            <label><input type="radio" name="salon" value="Si"> Sí</label>
                            <label><input type="radio" name="salon" value="No"> No</label>
                        </div>
                    </div>

                    <!-- ¿Incluye barra libre? -->
                    <div class="grupo-campo">
                        <label>¿Incluye barra libre?</label>
                        <div class="grupo-opciones">
                            <label><input type="radio" name="barra" value="Si"> Sí</label>
                            <label><input type="radio" name="barra" value="No"> No</label>
                        </div>
                    </div>

                    <!-- Seleccionar platos -->
                    <div class="grupo-campo">
                        <label>Seleccionar platos</label>
                        <div class="grupo-checkboxes">
                            <label><input type="checkbox" name="platos" value="Entrada"> Entrada</label>
                            <label><input type="checkbox" name="platos" value="Plato fuerte"> Plato fuerte</label>
                            <label><input type="checkbox" name="platos" value="Postre"> Postre</label>
                        </div>
                    </div>

                    <!-- Algo que aclarar -->
                    <div class="grupo-campo">
                        <label for="aclaracion">Algo que aclarar</label>
                        <textarea id="aclaracion" rows="4" placeholder="Escribí aquí tus detalles adicionales..." class="input-estilo"></textarea>
                    </div>

                    <!-- Datos de contacto (Nombre y Teléfono) -->
                    <div class="grupo-contacto-grid">
                        <div class="grupo-campo">
                            <label for="nombre-cliente">Nombre</label>
                            <input type="text" id="nombre-cliente" placeholder="Tu nombre y apellido" required class="input-estilo">
                        </div>
                        <div class="grupo-campo">
                            <label for="telefono-cliente">Número de teléfono</label>
                            <input type="tel" id="telefono-cliente" placeholder="Ej: 2645123456" required class="input-estilo">
                        </div>
                    </div>

                    <!-- Botón Enviar Presupuesto -->
                    <div class="zona-postular">
                        <button type="submit" class="boton-enviar-presupuesto">Enviar presupuesto</button>
                    </div>

                </form>
            </section>
        </main>

        <!-- PIE DE PÁGINA -->
        <footer class="pie">

            </div>

        </footer>

    </div>
