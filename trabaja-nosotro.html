<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajá con nosotros - TU CATERING</title>
    <!-- Fuente Serif elegante -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="trabaja.css">
</head>

<body>

    <div class="layout-principal">

       <!-- ENCABEZADO CON MENÚ HAMBURGUESA -->
        <header class="encabezado">
    <!-- El logo ahora está dentro de un enlace que apunta a index.html -->
    <div class="logo">
        <a href="index.html">
            <img src="Logo.png" alt="TU CATERING - Ir al inicio">
        </a>
    </div>
     <!-- Contenedor para el menú móvil y botón -->
    <div class="contenedor-menu">
        <button class="menu-hamburguesa" id="hamburguesa-btn" aria-label="Abrir menú">
            <span></span>
            <span></span>
            <span></span>
        </button>

            <nav class="menu">
                <a href="index.html">Inicio</a>
                <a href="sobrenosotros.html">Sobre nosotros</a>
                <a href="presupuesto.html">Presupuestos</a>
            </nav>
        </header>
        <!-- Contenido Central -->
        <main>
            <section class="empleo">

                <div class="titulo-seccion">
                    <span class="linea-decorativa"></span>
                    <h1>Trabajá con nosotros</h1>
                </div>

                <form id="formularioEmpleo">

                    <!-- Selector de perfil -->
                    <div class="grupo-campo">
                        <label for="perfil">Perfiles buscados</label>
                        <div class="select-personalizado">
                            <select id="perfil" required>
                                <option value="Mozo">Mozo</option>
                                <option value="Cajero">Cajero</option>
                                <option value="Cocinero">Cocinero</option>
                            </select>
                        </div>
                    </div>

                    <!-- Lista de Requisitos -->
                    <div class="seccion-requisitos">
                        <h2>Requisitos</h2>
                        <ul class="lista-requisitos">
                            <li>Ser mayor de 18 años</li>
                            <li>Disponibilidad full-time</li>
                            <li>3 años de experiencia</li>
                        </ul>
                    </div>

                    <!-- Carga de CV -->
                    <div class="zona-cv">
                        <input type="file" id="cv" accept=".pdf,.doc,.docx" hidden required>
                        <label for="cv" class="boton-cv">Cargar CV</label>
                        <span id="nombreArchivo" class="nombre-archivo"></span>
                    </div>

                    <!-- Botón Postular centrado -->
                    <div class="zona-postular">
                        <button type="submit" class="boton-postular">Postular</button>
                    </div>

                </form>

            </section>
        </main>

        <!-- Pie de página -->
        <footer class="pie">
            <div class="redes">
                <a href="#" aria-label="Instagram" class="icono-red">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="6" r="1" fill="currentColor"/></svg>
                </a>
                <a href="#" aria-label="YouTube" class="icono-red">
                    <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9 L16 12 L10 15 Z" fill="currentColor"/></svg>
                </a>
                <a href="#" aria-label="Facebook" class="icono-red">
                    <svg viewBox="0 0 24 24"><path d="M14 21 V13 H17 L17.5 9 H14 V7 C14 6 14.5 5.5 16 5.5 H18 V2 H15 C11.5 2 10 4 10 7 V9 H7 V13 H10 V21 Z" fill="currentColor"/></svg>
                </a>
            </div>
            <p class="copyright">Todos los derechos reservados</p>
        </footer>

    </div>

    <script src="trabaja.js"></script>
</body>
</html>
